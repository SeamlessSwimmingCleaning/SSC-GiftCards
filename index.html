<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC Gift Cards</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 30px 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { padding: 12px; font-size: 16px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
        button { padding: 12px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #218838; }
        .card { display: none; margin-top: 30px; padding: 20px; border: 2px dashed #007bff; border-radius: 10px; background: #e8f4fd; text-align: left; }
        .loading { display: none; color: #666; font-style: italic; margin-top: 10px; }
        .debug-box { margin-top: 40px; font-size: 11px; color: #555; text-align: left; background: #eee; padding: 10px; border-radius: 5px; word-break: break-all; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>💳 SSC Gift Cards</h1>
    <p>Enter your code to view your balance:</p>
    
    <input type="text" id="familyCode" placeholder="Enter password here...">
    <button onclick="checkCode()">View Card</button>
    <div id="loadingText" class="loading">Connecting to live spreadsheet...</div>

    <!-- Dynamic Family Member View -->
    <div id="userCard" class="card">
        <h2 style="margin-top:0;" id="userCardTitle">SSC Gift Card</h2>
        <p>Current Balance: <strong style="color:#28a745; font-size: 1.2em;">$<span id="userBalanceDisplay">0.00</span></strong></p>
        <p>Card Status: <strong>Active ✅</strong></p>
    </div>

    <!-- System Diagnostic Box -->
    <div class="debug-box">
        <strong>System Data Inspector:</strong>
        <div id="debugLog">Waiting for passcode...</div>
    </div>
</div>

<script>
    // 🚨 PASTE YOUR ENTIRE "PUBLISH TO WEB" CSV LINK BETWEEN THE QUOTES BELOW:
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuI6kvYTgt_1Yovf9J6eQcZoNM4RMR8h4TcuiIe1pMF0N8J1fH29BMz0hGaX1ae-TZ-y3faCDnzlwj/pubhtml';

    function logDebug(htmlMessage) {
        document.getElementById('debugLog').innerHTML = htmlMessage;
    }

    async function checkCode() {
        const enteredCode = document.getElementById('familyCode').value.trim();
        const cardFrame = document.getElementById('userCard');
        const loadingFrame = document.getElementById('loadingText');
        
        if (!enteredCode) return alert("Please enter your passcode.");
        
        cardFrame.style.display = 'none';
        loadingFrame.style.display = 'block';
        logDebug("Connecting to Google Servers...");

        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
            
            const rawText = await response.text();
            
            // Clean up both standard newlines (\n) AND carriage returns (\r) to kill hidden formatting spacing
            const rows = rawText.split(/\r?\n/);
            let userFound = null;
            let logViewer = "<strong>Spreadsheet rows found:</strong><br>";

            // Loop rows, skipping headers line 0
            for (let i = 1; i < rows.length; i++) {
                let currentRow = rows[i].trim();
                if (!currentRow) continue;
                
                // Parse rows strictly bypassing inline quotation mark groupings
                let columns = currentRow.split(',');
                
                if (columns.length >= 3) {
                    // Extract values and aggressively strip quotes and invisible white spaces
                    let passcode = columns[0].replace(/^"|"$/g, '').replace(/[\x00-\x1F\x7F-\x9F]/g, "").trim();
                    let name = columns[1].replace(/^"|"$/g, '').replace(/[\x00-\x1F\x7F-\x9F]/g, "").trim();
                    let balance = columns[2].replace(/^"|"$/g, '').replace(/[\x00-\x1F\x7F-\x9F]/g, "").trim();

                    logViewer += `Row ${i} -> Read Passcode: "${passcode}" | Name: "${name}" | Balance: "${balance}"<br>`;

                    if (passcode === enteredCode) {
                        userFound = { name: name, balance: parseFloat(balance) };
                        break;
                    }
                } else {
                    logViewer += `<span style="color:red;">Row ${i} has improper structure (needs at least 3 columns). Row text: "${currentRow}"</span><br>`;
                }
            }

            loadingFrame.style.display = 'none';

            if (userFound) {
                logDebug(`<strong>Success!</strong> Welcome ${userFound.name}.<br><br>` + logViewer);
                document.getElementById('userCardTitle').innerText = `SSC Gift Card — ${userFound.name}`;
                document.getElementById('userBalanceDisplay').innerText = userFound.balance.toFixed(2);
                cardFrame.style.display = 'block';
            } else {
                logDebug(`<strong>Error:</strong> Password "${enteredCode}" did not match any items list below.<br><br>` + logViewer);
                alert('Passcode not recognized. Look at the list below to check spelling!');
            }

        } catch (error) {
            loadingFrame.style.display = 'none';
            logDebug(`<strong>CRITICAL FAULT:</strong> ${error.message}<br>Verify your share link setting matches Step 1 exactly.`);
            alert('Could not sync data feed. Look at the data inspector box below.');
        }
    }
</script>
</body>
</html>
