<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta tags to hide the mobile browser top address bar -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>SSC Gift Cards</title>
    
    <!-- 📊 Include JsBarcode Library via CDN for real scannable barcodes -->
    <!-- Corrected and updated CDN link -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background: #eef2f3; 
            color: #333; 
        }
        .container { 
            max-width: 450px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        }
        h1 { 
            color: #1a1a1a; 
            font-size: 28px; 
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        input { 
            padding: 14px; 
            font-size: 16px; 
            margin: 10px 0; 
            border-radius: 10px; 
            border: 2px solid #e0e0e0; 
            width: 100%; 
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* 🎨 COLOR CUSTOMIZATION PANEL */
        .color-picker-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 15px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            margin: 10px 0;
        }
        .color-picker-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        input[type="color"] {
            padding: 0;
            width: 45px;
            height: 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            margin: 0;
        }
        
        button { 
            padding: 14px 20px; 
            font-size: 16px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
            transition: all 0.2s;
        }
        button:hover { 
            background: #218838; 
            transform: translateY(-1px);
        }
        .loading { 
            display: none; 
            color: #666; 
            font-style: italic; 
            margin-top: 15px; 
            font-size: 14px;
        }

        /* 💳 REALISTIC METALLIC GIFT CARD LOOK */
        .card { 
            display: none; 
            margin-top: 35px; 
            padding: 25px; 
            border-radius: 16px; 
            /* Premium dark platinum gradient style */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            color: white;
            text-align: left; 
            position: relative;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.35);
            overflow: hidden;
            aspect-ratio: 1.586 / 1; /* Match actual physical credit card dimensions */
        }
        /* Glossy card overlay shine effect */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-logo {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-chip {
            width: 35px;
            height: 26px;
            background: linear-gradient(135deg, #fef08a, #ca8a04);
            border-radius: 4px;
            opacity: 0.8;
        }
        .card-holder {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .membership-status {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            display: inline-block;
        }
        .card-balance-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 2px;
        }
        .card-balance { 
            font-size: 32px; 
            font-weight: 700; 
            color: #4ade80;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
       /* 📊 SCANNABLE BARCODE CONTAINER */
        .barcode-container {
            margin-top: 25px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .barcode-container svg {
            width: 100%;
            height: auto;
            max-height: 60px;
        }

        .barcode-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #333;
            margin-top: 6px;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💳 SSC Gift Cards</h1>
    <p class="subtitle">Enter your passcode to retrieve your gift card balance</p>
    
    <input type="text" id="familyCode" placeholder="Type your passcode here...">
    <!-- Color Customizer Wheel Module -->
    <div class="color-picker-container">
        <span class="color-picker-label">🎨 Customize Card Color:</span>
        <input type="color" id="cardColorWheel" value="#1e293b">
    </div>
    <button onclick="handleAccessWallet()">Access Gift Card</button>
    <div id="loadingText" class="loading">Syncing Gift Card Data...</div>

    <!-- 💳 Beautiful Dynamic Gift Card Interface -->
    <div id="userCard" class="card">
        <div class="card-header">
            <span class="card-logo">SSC PREMIUM</span>
            <div class="card-chip"></div>
        </div>
        
        <div class="card-holder" id="userCardTitle">GIFT CARD HOLDER</div>
        <div class="membership-status" id="membershipStatus">MEMBERSHIP STATUS</div>
        
        <div class="card-balance-label">Available Balance</div>
        <div class="card-balance">$<span id="userBalanceDisplay">0.00</span></div>
    
        <!-- Scannable SVG Barcode Graphic Target -->
        <div class="barcode-container">
            <svg id="barcodeTarget"></svg>
        </div>
    </div>
</div>

<script>
    // 🚨 IMPORTANT SECURITY NOTE:
    // For production environments, avoid directly embedding CSV URLs.
    // Implement a secure backend API to fetch and validate data.
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuI6kvYTgt_1Yovf9J6eQcZoNM4RMR8h4TcuiIe1pMF0N8J1fH29BMz0hGaX1ae-TZ-y3faCDnzlwj/pub?output=csv';
    
    const colorPicker = document.getElementById('cardColorWheel');
    const userCard = document.getElementById('userCard');
    const familyCodeInput = document.getElementById('familyCode');
    const loadingText = document.getElementById('loadingText');
    const userCardTitle = document.getElementById('userCardTitle');
    const userBalanceDisplay = document.getElementById('userBalanceDisplay');
    const membershipStatus = document.getElementById('membershipStatus');
    const barcodeTarget = document.getElementById('barcodeTarget');

    /**
     * Applies the selected color to the gift card background.
     * @param {string} hexColor - The hex color string (e.g., "#1e293b").
     */
    function applyCardColor(hexColor) {
        userCard.style.background = `linear-gradient(135deg, ${hexColor} 0%, #050505 100%)`;
    }

    /**
     * Loads and applies the user's previously saved card color preference from local storage.
     */
    function loadSavedCardColor() {
        const savedColor = localStorage.getItem('sscUserCardColor');
        if (savedColor) {
            colorPicker.value = savedColor;
            applyCardColor(savedColor);
        }
    }

    /**
     * Robust CSV parser that handles both quoted and unquoted fields.
     * @param {string} csvString - The raw CSV content as a string.
     * @returns {Array<Array<string>>} An array of arrays representing the CSV rows and columns.
     */
    function parseCsv(csvString) {
        const rows = csvString.split(/\r?\n/).filter(row => row.trim());
        const data = [];

        for (const row of rows) {
            const columns = [];
            let current = '';
            let insideQuotes = false;
            
            for (let i = 0; i < row.length; i++) {
                const char = row[i];
                const nextChar = row[i + 1];
                
                if (char === '"') {
                    if (insideQuotes && nextChar === '"') {
                        // Escaped quote
                        current += '"';
                        i++; // Skip next quote
                    } else {
                        // Toggle quote state
                        insideQuotes = !insideQuotes;
                    }
                } else if (char === ',' && !insideQuotes) {
                    // End of field
                    columns.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            
            // Add last field
            if (current || columns.length > 0) {
                columns.push(current.trim());
            }
            
            if (columns.length > 0) {
                data.push(columns);
            }
        }
        
        return data;
    }

    /**
     * Fetches data from the CSV URL and attempts to find a matching user.
     * @param {string} enteredCode - The passcode entered by the user.
     * @returns {Promise<object|null>} A promise that resolves with user data or null if not found.
     */
    async function fetchAndValidateUserData(enteredCode) {
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
            }
            
            const rawText = await response.text();
            const csvData = parseCsv(rawText);

            // Log for debugging purposes
            console.log("CSV Data:", csvData);
            console.log("Looking for passcode:", enteredCode);

            for (const row of csvData) {
                if (row.length >= 3) {
                    const passcode = row[0].trim();
                    const name = row[1].trim();
                    const balance = parseFloat(row[2]);
                    const membership = row.length >= 4 ? row[3].trim() : "Standard";

                    console.log(`Comparing "${passcode}" with "${enteredCode}"`);

                    if (passcode === enteredCode) {
                        console.log("Match found!");
                        return { name: name, balance: balance, pass: passcode, membership: membership };
                    }
                }
            }
            console.log("No match found");
            return null; // User not found
        } catch (error) {
            console.error("Error fetching or parsing CSV data:", error);
            throw error; // Re-throw to be caught by the caller
        }
    }

    /**
     * Handles the user's request to access their wallet.
     */
    async function handleAccessWallet() {
        const enteredCode = familyCodeInput.value.trim();
        
        if (!enteredCode) {
            alert("Please enter your passcode.");
            return;
        }
        
        // Reset UI states
        userCard.style.display = 'none';
        loadingText.style.display = 'block';

        try {
            const userData = await fetchAndValidateUserData(enteredCode);

            loadingText.style.display = 'none';

            if (userData) {
                // Update card details
                userCardTitle.innerText = userData.name;
                userBalanceDisplay.innerText = userData.balance.toFixed(2);
                membershipStatus.innerText = userData.membership.toUpperCase();
                
                // Generate barcode
                JsBarcode(barcodeTarget, userData.pass.toUpperCase(), {
                    format: "CODE128",
                    lineColor: "#000000",
                    width: 2,
                    height: 40,
                    displayValue: true,
                    fontSize: 13,
                    fontOptions: "bold",
                    font: "Courier New"
                });
                
                // Show the card
                userCard.style.display = 'block';
            } else {
                // User not found or invalid code
                alert("Invalid passcode. Please check your code and try again.");
            }
        } catch (error) {
            loadingText.style.display = 'none';
            // Provide a more specific error message to the user
            alert('Could not sync card details. Please ensure you are connected to the internet and try again.');
            console.error("Wallet access error:", error);
        }
    }

    // Initialize color picker and load saved color on page load
    loadSavedCardColor();

    // Save picked selection state directly into persistent storage slots
    colorPicker.addEventListener('input', (event) => {
        const pickedColor = event.target.value;
        applyCardColor(pickedColor);
        localStorage.setItem('sscUserCardColor', pickedColor);
    });

    // Optional: Allow pressing Enter in the input field to trigger the button click
    familyCodeInput.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); // Prevent default form submission if it were in a form
            handleAccessWallet();
        }
    });

</script>
</body>
</html>
