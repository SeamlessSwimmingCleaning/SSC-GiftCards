<!DOCTYPE html>
<html lang="en">

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: #eef2f3; 
            color: #333; 
        }
        .container { 
            max-width: 450px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);

            font-size: 28px;

        }

            padding: 14px; 
            font-size: 16px; 
            margin: 10px 0; 
            border-radius: 10px; 
            border: 2px solid #e0e0e0; 
            width: 100%; 
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }

/* 🎨 COLOR CUSTOMIZATION PANEL */
.color-picker-container {

    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    padding: 12px 15px;
    border-radius: 10px;
    border: 2px solid #e2e8f0;
    margin: 10px 0;
}
.color-picker-label {
    font-size: 14px;
    font-weight: 600;
    color: #475569;
}
input[type="color"] {
    padding: 0;
    width: 45px;
    height: 35px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: none;
    margin: 0;
}

        
        button { 
            padding: 14px 20px; 
            font-size: 16px; 
            background: #28a745;

            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-top: 10px; 
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
            transition: all 0.2s;
        }
        button:hover { 
            background: #218838;

        }
        .loading {

            color: #666; 
            font-style: italic; 
            margin-top: 15px; 
            font-size: 14px;
        }

        /* 💳 REALISTIC METALLIC GIFT CARD LOOK */
        .card { 
            display: none; 
            margin-top: 35px; 
            padding: 25px; 
            border-radius: 16px; 
            /* Premium dark platinum gradient style */
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            color: white;
            text-align: left; 
            position: relative;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.35);
            overflow: hidden;
            aspect-ratio: 1.586 / 1; /* Match actual physical credit card dimensions */
        }
        /* Glossy card overlay shine effect */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-logo {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-chip {
            width: 35px;
            height: 26px;
            background: linear-gradient(135deg, #fef08a, #ca8a04);
            border-radius: 4px;
            opacity: 0.8;
        }
        .card-holder {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-balance-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 2px;
        }
        .card-balance { 
            font-size: 32px; 
            font-weight: 700; 
            color: #4ade80;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
       /* 📊 SCANNABLE BARCODE CONTAINER */
.barcode-container {

    background: white;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.barcode-container svg {
    width: 100%;
    height: auto;
    max-height: 60px;
}

        .barcode-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #333;
            margin-top: 6px;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
